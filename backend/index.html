<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интеллектуальный поиск документов</title>
    <!-- Подключаем современный шрифт Outfit и Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f4f6f9;
            --panel-color: #ffffff;
            --border-color: #e2e8f0;
            --border-hover: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent-glow: rgba(59, 130, 246, 0.1);
            
            /* Гармоничная цветовая палитра */
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 20%, rgba(59, 130, 246, 0.05) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(16, 185, 129, 0.03) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            overflow-y: scroll;
        }

        /* Заголовок */
        header {
            width: 100%;
            max-width: 900px;
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e3a8a 0%, #0f766e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        /* Индикатор подключения */
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--success);
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Основной контейнер */
        main {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Панель поиска с Glassmorphism эффектом */
        .search-panel {
            background: var(--panel-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            transition: all 0.3s;
        }

        .search-panel:focus-within {
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* Поля ввода */
        .inputs-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
        }

        @media(min-width: 640px) {
            .inputs-row {
                grid-template-columns: 200px 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.85rem 1rem;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: all 0.25s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            background-color: #ffffff;
        }

        /* Кнопки переключения режима поиска */
        .search-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.25rem;
        }

        .mode-selector {
            background-color: #f1f5f9;
            border: 1px solid var(--border-color);
            padding: 4px;
            border-radius: 10px;
            display: inline-flex;
            position: relative;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 0.5rem 1.25rem;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            z-index: 2;
            transition: color 0.25s ease;
            outline: none;
        }

        .mode-btn.active {
            color: #ffffff;
        }

        /* Элемент-ползунок для переключения вкладок */
        .mode-slider {
            position: absolute;
            top: 4px;
            left: 4px;
            height: calc(100% - 8px);
            width: calc(50% - 4px);
            background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
            border-radius: 8px;
            z-index: 1;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }

        .mode-btn:nth-child(3).active ~ .mode-slider {
            transform: translateX(100%);
        }

        /* Лимит и кнопка */
        .limit-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .limit-slider-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        input[type="range"] {
            width: 100px;
            accent-color: var(--primary);
            cursor: pointer;
            padding: 0;
        }

        .limit-value {
            font-weight: 600;
            color: var(--primary);
            font-size: 0.95rem;
            width: 20px;
        }

        .checkbox-container {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            user-select: none;
            margin-left: 0.5rem;
            margin-right: 0.5rem;
            transition: color 0.2s ease;
        }

        .checkbox-container:hover {
            color: var(--text-primary);
        }

        .checkbox-container input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
            margin: 0;
        }

        .search-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            border: none;
            border-radius: 10px;
            color: white;
            padding: 0.85rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .search-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
        }

        .search-btn:active {
            transform: translateY(1px);
        }

        /* История поиска */
        .history-panel {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
        }

        .history-title {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .history-tag {
            background-color: #e2e8f0;
            border: 1px solid #cbd5e1;
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .history-tag:hover {
            background-color: #cbd5e1;
            border-color: #94a3b8;
        }

        .history-tag .remove-btn {
            color: var(--text-secondary);
            border: none;
            background: none;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .history-tag .remove-btn:hover {
            color: var(--error);
        }

        /* Результаты поиска */
        .results-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .results-header {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .results-count {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Карточка результата */
        .result-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(0, 0, 0, 0.02);
        }

        .result-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-hover);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
        }

        /* Линия акцента слева в зависимости от релевантности */
        .result-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background-color: var(--primary);
        }

        .result-card.score-high::before { background-color: var(--success); }
        .result-card.score-medium::before { background-color: var(--warning); }
        .result-card.score-low::before { background-color: var(--text-secondary); }

        .card-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
        }

        .doc-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 1.05rem;
        }

        .doc-icon {
            color: var(--primary);
            flex-shrink: 0;
        }

        .badges {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .badge-egrpou {
            background-color: rgba(37, 99, 235, 0.08);
            color: #1d4ed8;
            border: 1px solid rgba(37, 99, 235, 0.2);
        }

        .badge-score {
            background-color: rgba(16, 185, 129, 0.08);
            color: #065f46;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .score-medium .badge-score {
            background-color: rgba(245, 158, 11, 0.08);
            color: #92400e;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .score-low .badge-score {
            background-color: rgba(156, 163, 175, 0.08);
            color: #374151;
            border: 1px solid rgba(156, 163, 175, 0.2);
        }

        .card-body {
            color: #334155;
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
            position: relative;
        }

        /* Выделение поисковых фраз */
        .highlight {
            background-color: rgba(253, 224, 71, 0.4);
            color: #0f172a;
            padding: 0 2px;
            border-radius: 2px;
            border-bottom: 1px solid rgba(234, 179, 8, 0.5);
        }

        .card-footer {
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid var(--border-color);
            padding-top: 0.75rem;
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.8rem;
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            transition: all 0.2s;
        }

        .action-btn:hover {
            color: var(--text-primary);
            background-color: #f8fafc;
            border-color: var(--border-hover);
        }

        /* Загрузка / скелетон */
        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-card {
            height: 160px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        /* Пустые результаты */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: rgba(255, 255, 255, 0.5);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .empty-icon {
            font-size: 2.5rem;
            color: rgba(59, 130, 246, 0.3);
        }

        .empty-text {
            font-size: 1rem;
            font-weight: 500;
        }

        /* Справка по загрузке */
        .info-card {
            background-color: rgba(37, 99, 235, 0.05);
            border: 1px solid rgba(37, 99, 235, 0.15);
            border-radius: 12px;
            padding: 1rem;
            font-size: 0.85rem;
            color: #1e40af;
            display: flex;
            gap: 0.75rem;
            line-height: 1.5;
        }

        .info-icon {
            font-size: 1.25rem;
            flex-shrink: 0;
            color: #2563eb;
        }

        .info-card a {
            color: #2563eb;
            text-decoration: underline;
        }

        .info-card a:hover {
            color: #1d4ed8;
        }

        /* --- AI Gemini Integration Styles --- */
        .api-key-group {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px dashed var(--border-color);
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
            width: 100%;
        }

        @media(min-width: 640px) {
            .api-key-group {
                grid-template-columns: 1.2fr 0.8fr;
            }
        }

        .api-key-wrapper {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            width: 100%;
        }

        .model-select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 1rem;
            padding-right: 2.25rem !important;
            cursor: pointer;
            background-color: #ffffff;
        }

        .api-key-input {
            width: 100%;
            padding: 0.6rem 2.5rem 0.6rem 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: monospace;
            background: #fafafa;
            transition: all 0.2s;
        }

        .api-key-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            background: #ffffff;
        }

        .eye-btn {
            position: absolute;
            right: 0.5rem;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.25rem;
            font-size: 1rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .eye-btn:hover {
            color: var(--text-primary);
        }

        .ai-assistant-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(37, 99, 235, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.05), 0 8px 10px -6px rgba(37, 99, 235, 0.05);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            transition: all 0.3s;
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .ai-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ai-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: -0.25rem;
        }

        .prompt-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.25rem;
        }

        .prompt-chip {
            background-color: #f1f5f9;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 0.9rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .prompt-chip:hover {
            background-color: #eff6ff;
            border-color: rgba(37, 99, 235, 0.5);
            color: var(--primary);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.1);
        }

        .ai-input-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.25rem;
        }

        .ai-input {
            flex-grow: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .ai-input:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }

        .ai-ask-btn {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 0 1.25rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .ai-ask-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
        }

        .ai-loader {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            padding: 0.5rem 0.25rem;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            border-radius: 50%;
            animation: pulse-loader 1.5s infinite ease-in-out;
        }

        @keyframes pulse-loader {
            0%, 100% { transform: scale(0.6); opacity: 0.4; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        .ai-response-box {
            background-color: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            font-size: 0.92rem;
            line-height: 1.6;
            color: #334155;
            max-height: 400px;
            overflow-y: auto;
            animation: fadeIn 0.3s ease-out;
        }

        .ai-response-box h4 {
            font-size: 1rem;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        .ai-response-box p {
            margin-bottom: 0.75rem;
        }

        .ai-response-box p:last-child {
            margin-bottom: 0;
        }

        .ai-response-box ul, .ai-response-box ol {
            margin-left: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .ai-response-box li {
            margin-bottom: 0.35rem;
        }

        .ai-response-box strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .ai-response-box blockquote {
            border-left: 3px solid #7c3aed;
            padding-left: 0.75rem;
            color: var(--text-secondary);
            margin: 0.75rem 0;
            font-style: italic;
        }

        .ai-response-box .source-citation {
            display: inline-block;
            background-color: #eff6ff;
            color: #1e40af;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 0.15rem 0.35rem;
            border-radius: 4px;
            margin-left: 0.25rem;
            border: 1px solid rgba(59, 130, 246, 0.15);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Smart Document Search</h1>
    </header>

    <main>

        <!-- Панель управления поиском -->
        <div class="search-panel">
            <form id="searchForm" onsubmit="event.preventDefault(); triggerSearch();">
                <div class="inputs-row">
                    <!-- Поле ЕГРПОУ -->
                    <div class="input-group">
                        <label for="egrpou">Код ЕГРПОУ</label>
                        <input type="text" id="egrpou" placeholder="Например: 12345678" required pattern="[0-9]+" title="Введите цифры кода компании">
                    </div>
                    <!-- Поле запроса -->
                    <div class="input-group">
                        <label for="query">Поисковый запрос</label>
                        <input type="text" id="query" placeholder="Введите поисковый запрос по смыслу или ключевым словам...">
                    </div>
                </div>

                <!-- Управление поиском: режимы, лимит и кнопка запуска -->
                <div class="search-controls">
                    <!-- Выбор режима: Keyword vs Semantic -->
                    <div class="mode-selector">
                        <button type="button" class="mode-btn active" id="btnKeyword" onclick="setSearchMode('keyword')">По словам (Keyword)</button>
                        <button type="button" class="mode-btn" id="btnSemantic" onclick="setSearchMode('semantic')">По смыслу (Semantic)</button>
                        <div class="mode-slider"></div>
                    </div>

                    <!-- Лимиты и отправка -->
                    <div class="limit-group">
                        <div class="limit-slider-container" style="display: none;">
                            <label for="limit" style="font-size: 0.8rem;">Лимит:</label>
                            <input type="range" id="limit" min="1" max="20" value="10" oninput="document.getElementById('limitVal').innerText = this.value">
                            <span class="limit-value" id="limitVal">10</span>
                        </div>

                        <label class="checkbox-container" style="display: none;">
                            <input type="checkbox" id="showAll" onchange="toggleLimitSlider(this.checked)">
                            <span>Все</span>
                        </label>

                        <button type="submit" class="search-btn">
                            🔍 Найти
                        </button>
                    </div>
                </div>
            </form>

            <!-- История поиска ЕГРПОУ -->
            <div class="history-panel" id="historyPanel" style="display: none;">
                <span class="history-title">Недавние ЕГРПОУ:</span>
                <div id="historyTags" style="display: flex; flex-wrap: wrap; gap: 0.5rem;"></div>
            </div>

            <!-- Интеграция с Gemini AI -->
            <div class="api-key-group">
                <div class="input-group">
                    <label for="geminiKey">Gemini API Key</label>
                    <div class="api-key-wrapper">
                        <input type="password" id="geminiKey" class="api-key-input" placeholder="Введите Gemini API Key (AIzaSy...)">
                        <button type="button" class="eye-btn" id="toggleKeyBtn" onclick="toggleApiKeyVisibility()" title="Показать/скрыть ключ">👁️</button>
                    </div>
                </div>
                <div class="input-group">
                    <label for="geminiModel">ИИ Модель (RAG)</label>
                    <select id="geminiModel" class="api-key-input model-select" onchange="localStorage.setItem('gemini_selected_model', this.value)">
                        <!-- Будет заполнено динамически или дефолтными значениями -->
                    </select>
                </div>
            </div>
        </div>

        <!-- ИИ Ассистент (RAG) -->
        <div class="ai-assistant-panel" id="aiPanel" style="display: none;">
            <div class="ai-header">
                <span style="font-size: 1.5rem;">✨</span>
                <div style="display: flex; flex-direction: column;">
                    <span class="ai-title">ИИ Ассистент Gemini (RAG)</span>
                    <span class="ai-subtitle">Умный анализ найденных фрагментов документов</span>
                </div>
            </div>
            
            <div class="prompt-chips">
                <button type="button" class="prompt-chip" onclick="askPreset('summarize')">📝 Краткая выжимка</button>
                <button type="button" class="prompt-chip" onclick="askPreset('risks')">🔍 Найти риски</button>
                <button type="button" class="prompt-chip" onclick="askPreset('finances')">💰 Реквизиты, даты и суммы</button>
            </div>
            
            <div class="ai-input-group">
                <input type="text" id="aiQuestion" class="ai-input" placeholder="Задайте свой вопрос по документам (например: Кто утвердил это распоряжение?)...">
                <button type="button" class="ai-ask-btn" onclick="askCustomQuestion()">
                    <span>✈️</span> Спросить
                </button>
            </div>
            
            <div class="ai-loader" id="aiLoader" style="display: none;">
                <span class="pulse-dot"></span>
                <span>Gemini анализирует документы...</span>
            </div>
            
            <div class="ai-response-box" id="aiResponse" style="display: none;"></div>
        </div>

        <!-- Раздел результатов (скрыт по запросу — чанки не выводятся) -->
        <div class="results-section" style="display: none;">
            <div class="results-header" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <span>Результаты поиска</span>
                    <span class="results-count" id="resultsCount" style="display: none;">Найдено чанков: 0</span>
                </div>
                <button type="button" class="action-btn" id="toggleResultsBtn" onclick="toggleResultsVisibility()" style="display: none; align-items: center; gap: 0.35rem; font-size: 0.85rem; padding: 0.4rem 0.85rem;">
                    <span>👁️</span> Показать фрагменты
                </button>
            </div>

            <!-- Контейнер для отображения карт -->
            <div id="resultsContainer">
                <div class="empty-state">
                    <div class="empty-icon">📁</div>
                    <div class="empty-text">Введите ЕГРПОУ клиента и поисковый запрос, чтобы начать поиск</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentSearchMode = 'keyword';
        let lastSearchResults = []; // Глобальное хранилище для RAG
        let currentUniqueFiles = []; // Список уникальных файлов клиента для RAG
        const egrpouInput = document.getElementById('egrpou');
        const queryInput = document.getElementById('query');
        const limitInput = document.getElementById('limit');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsCount = document.getElementById('resultsCount');
        const historyPanel = document.getElementById('historyPanel');
        const historyTags = document.getElementById('historyTags');

        // Переменные для Gemini
        const geminiKeyInput = document.getElementById('geminiKey');
        const aiPanel = document.getElementById('aiPanel');
        const aiQuestionInput = document.getElementById('aiQuestion');
        const aiLoader = document.getElementById('aiLoader');
        const aiResponse = document.getElementById('aiResponse');

        // Инициализация истории из localStorage при загрузке
        document.addEventListener('DOMContentLoaded', () => {
            renderHistory();
            
            // Если в истории что-то есть, берем последний ЕГРПОУ как значение по умолчанию
            const history = getHistory();
            if (history.length > 0) {
                egrpouInput.value = history[0];
            }

            // Загружаем сохраненный API-ключ Gemini из localStorage
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                geminiKeyInput.value = savedKey;
                fetchModels(savedKey);
            } else {
                useDefaultModels();
            }

            // Сохраняем ключ в localStorage при его изменении
            geminiKeyInput.addEventListener('change', () => {
                const key = geminiKeyInput.value.trim();
                localStorage.setItem('gemini_api_key', key);
                if (key) {
                    fetchModels(key);
                } else {
                    useDefaultModels();
                }
            });
        });

        // Дефолтные модели на случай отсутствия сети или некорректного ключа
        const DEFAULT_MODELS = [
            { name: 'models/gemini-1.5-flash', displayName: 'Gemini 1.5 Flash' },
            { name: 'models/gemini-1.5-pro', displayName: 'Gemini 1.5 Pro' },
            { name: 'models/gemini-2.0-flash-exp', displayName: 'Gemini 2.0 Flash (Experimental)' },
            { name: 'models/gemini-2.5-flash', displayName: 'Gemini 2.5 Flash' },
            { name: 'models/gemini-2.5-pro', displayName: 'Gemini 2.5 Pro' },
            { name: 'models/gemini-pro', displayName: 'Gemini 1.0 Pro' }
        ];

        async function fetchModels(apiKey) {
            if (!apiKey) return;
            try {
                // Пытаемся получить список моделей с API
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models?key=${apiKey}`);
                if (!response.ok) {
                    throw new Error(`Ошибка: ${response.status}`);
                }
                const data = await response.json();
                if (data && data.models) {
                    const genModels = data.models
                        .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'))
                        .map(m => ({
                            name: m.name,
                            displayName: m.displayName || m.name.replace('models/', '')
                        }));
                    if (genModels.length > 0) {
                        populateModelDropdown(genModels);
                        return;
                    }
                }
                useDefaultModels();
            } catch (e) {
                console.warn('Не удалось загрузить модели с API, используем стандартный список:', e);
                useDefaultModels();
            }
        }

        function populateModelDropdown(modelsList) {
            const dropdown = document.getElementById('geminiModel');
            if (!dropdown) return;
            dropdown.innerHTML = '';
            
            const savedModel = localStorage.getItem('gemini_selected_model') || 'models/gemini-1.5-flash';
            
            modelsList.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.name;
                opt.innerText = m.displayName;
                if (m.name === savedModel) {
                    opt.selected = true;
                }
                dropdown.appendChild(opt);
            });

            if (dropdown.selectedIndex === -1 && dropdown.options.length > 0) {
                dropdown.selectedIndex = 0;
            }
            
            localStorage.setItem('gemini_selected_model', dropdown.value);
        }

        function useDefaultModels() {
            populateModelDropdown(DEFAULT_MODELS);
        }

        // Установка режима поиска
        function setSearchMode(mode) {
            currentSearchMode = mode;
            document.getElementById('btnKeyword').classList.toggle('active', mode === 'keyword');
            document.getElementById('btnSemantic').classList.toggle('active', mode === 'semantic');
        }

        // Переключение лимита
        function toggleLimitSlider(showAll) {
            const limitInput = document.getElementById('limit');
            const limitVal = document.getElementById('limitVal');
            if (showAll) {
                limitInput.disabled = true;
                limitInput.style.opacity = '0.4';
                limitVal.style.opacity = '0.4';
                limitVal.innerText = '∞';
            } else {
                limitInput.disabled = false;
                limitInput.style.opacity = '1';
                limitVal.style.opacity = '1';
                limitVal.innerText = limitInput.value;
            }
        }

        // Работа с историей в localStorage
        function getHistory() {
            try {
                return JSON.parse(localStorage.getItem('egrpou_history') || '[]');
            } catch {
                return [];
            }
        }

        function saveToHistory(egrpou) {
            if (!egrpou || !/^\d+$/.test(egrpou)) return;
            let history = getHistory();
            history = history.filter(item => item !== egrpou); // Удаляем дубликаты
            history.unshift(egrpou); // Добавляем в начало
            history = history.slice(0, 5); // Ограничиваем последними 5 записями
            localStorage.setItem('egrpou_history', JSON.stringify(history));
            renderHistory();
        }

        function removeFromHistory(egrpou, event) {
            if (event) event.stopPropagation();
            let history = getHistory();
            history = history.filter(item => item !== egrpou);
            localStorage.setItem('egrpou_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const history = getHistory();
            if (history.length === 0) {
                historyPanel.style.display = 'none';
                return;
            }
            historyPanel.style.display = 'flex';
            historyTags.innerHTML = '';
            history.forEach(egrpou => {
                const tag = document.createElement('div');
                tag.className = 'history-tag';
                tag.onclick = () => {
                    egrpouInput.value = egrpou;
                    triggerSearch();
                };
                tag.innerHTML = `
                    <span>${egrpou}</span>
                    <button class="remove-btn" onclick="removeFromHistory('${egrpou}', event)">&times;</button>
                `;
                historyTags.appendChild(tag);
            });
        }

        // Подсветка ключевых слов
        function highlightText(text, query) {
            if (!query || query.trim() === "") return escapeHtml(text);
            
            // Чистим запрос от лишних символов и разбиваем на отдельные слова
            const words = query.trim()
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "")
                .split(/\s+/)
                .filter(w => w.length > 2); // Подсвечиваем только слова длиннее 2 букв
            
            if (words.length === 0) return escapeHtml(text);

            let escapedText = escapeHtml(text);
            
            // Для каждого слова делаем замену с подсветкой
            words.forEach(word => {
                // Исключаем спецсимволы регулярки
                const cleanWord = word.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                try {
                    const regex = new RegExp(`(${cleanWord})`, 'gi');
                    escapedText = escapedText.replace(regex, '<span class="highlight">$1</span>');
                } catch (e) {
                    console.error(e);
                }
            });

            return escapedText;
        }

        // Безопасное экранирование HTML
        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // Запуск поиска
        async function triggerSearch() {
            const egrpou = egrpouInput.value.trim();
            const query = queryInput.value.trim();
            const showAll = document.getElementById('showAll').checked;
            const limit = showAll ? 1000 : limitInput.value;

            if (!egrpou) {
                alert('Пожалуйста, введите код ЕГРПОУ!');
                return;
            }

            saveToHistory(egrpou);

            // Отображаем скелетоны (индикатор загрузки)
            resultsCount.style.display = 'none';
            document.getElementById('toggleResultsBtn').style.display = 'none';
            resultsContainer.style.display = 'flex'; // Показываем скелетоны
            resultsContainer.innerHTML = `
                <div class="result-card skeleton-card skeleton"></div>
                <div class="result-card skeleton-card skeleton"></div>
                <div class="result-card skeleton-card skeleton"></div>
            `;

            try {
                const params = new URLSearchParams({
                    egrpou: egrpou,
                    query: query,
                    mode: currentSearchMode,
                    limit: limit
                });

                const response = await fetch(`/search?${params.toString()}`);
                
                if (!response.ok) {
                    throw new Error(`Ошибка сервера: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                lastSearchResults = data; // Сохраняем результаты для RAG
                renderResults(data, query);

                // Загружаем список уникальных файлов клиента
                try {
                    const filesRes = await fetch(`/unique_files?egrpou=${encodeURIComponent(egrpou)}`);
                    if (filesRes.ok) {
                        const filesData = await filesRes.json();
                        currentUniqueFiles = filesData.files || [];
                    } else {
                        currentUniqueFiles = [];
                    }
                } catch (e) {
                    console.error("Ошибка при получении списка файлов клиента:", e);
                    currentUniqueFiles = [];
                }

                // Управляем видимостью ИИ панели
                if (data && data.length > 0) {
                    aiPanel.style.display = 'flex';
                    aiResponse.style.display = 'none';
                    aiQuestionInput.value = '';
                } else {
                    aiPanel.style.display = 'none';
                }

            } catch (error) {
                console.error(error);
                lastSearchResults = [];
                aiPanel.style.display = 'none';
                document.getElementById('toggleResultsBtn').style.display = 'none';
                resultsContainer.style.display = 'flex'; // Показываем ошибку
                resultsContainer.innerHTML = `
                    <div class="empty-state" style="border-color: rgba(239, 68, 68, 0.2); background: rgba(239, 68, 68, 0.05);">
                        <div class="empty-icon" style="color: var(--error);">⚠️</div>
                        <div class="empty-text" style="color: var(--error); font-weight: 600;">Не удалось выполнить поиск</div>
                        <div style="font-size: 0.85rem; color: var(--text-secondary); max-width: 400px; line-height: 1.4;">
                            ${error.message}. Убедитесь, что сервер FastAPI бэкенда запущен и Elasticsearch доступен.
                        </div>
                    </div>
                `;
            }
        }

        let showResultsFlag = false;

        function toggleResultsVisibility() {
            const container = document.getElementById('resultsContainer');
            const btn = document.getElementById('toggleResultsBtn');
            showResultsFlag = !showResultsFlag;
            
            if (showResultsFlag) {
                container.style.display = 'flex';
                container.style.flexDirection = 'column';
                container.style.gap = '1rem';
                btn.innerHTML = '<span>🙈</span> Скрыть фрагменты';
            } else {
                container.style.display = 'none';
                btn.innerHTML = '<span>👁️</span> Показать фрагменты';
            }
        }

        // Вывод результатов
        function renderResults(results, query) {
            resultsContainer.innerHTML = '';
            const toggleBtn = document.getElementById('toggleResultsBtn');
            
            if (!results || results.length === 0) {
                lastSearchResults = [];
                aiPanel.style.display = 'none';
                resultsCount.style.display = 'block';
                resultsCount.innerText = 'Найдено чанков: 0';
                toggleBtn.style.display = 'none';
                resultsContainer.style.display = 'flex';
                resultsContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <div class="empty-text">Ничего не найдено</div>
                        <div style="font-size: 0.85rem; color: var(--text-secondary);">
                            Попробуйте изменить поисковый запрос или проверить ЕГРПОУ клиента.
                        </div>
                    </div>
                `;
                return;
            }

            resultsCount.style.display = 'block';
            resultsCount.innerText = `Найдено чанков: ${results.length}`;

            // По умолчанию скрываем детальные результаты
            toggleBtn.style.display = 'flex';
            showResultsFlag = false;
            resultsContainer.style.display = 'none';
            toggleBtn.innerHTML = '<span>👁️</span> Показать фрагменты';

            results.forEach((chunk, index) => {
                const card = document.createElement('div');
                
                // Классифицируем скоры для раскраски бордера
                // В ES для keyword скор может быть > 1, для cosine similarity в семантическом поиске скор лежит в диапазоне [0, 1].
                let scoreClass = 'score-medium';
                if (currentSearchMode === 'semantic') {
                    if (chunk.score >= 0.7) scoreClass = 'score-high';
                    else if (chunk.score < 0.5) scoreClass = 'score-low';
                } else {
                    if (chunk.score >= 1.0) scoreClass = 'score-high';
                    else if (chunk.score < 0.3) scoreClass = 'score-low';
                }

                card.className = `result-card ${scoreClass}`;

                // Генерируем уникальный ID для возможности копирования
                const textId = `chunk-text-${index}`;
                const highlightedContent = highlightText(chunk.text, query);

                card.innerHTML = `
                    <div class="card-header">
                        <div class="doc-title">
                            <span class="doc-icon">📄</span>
                            <span>${escapeHtml(chunk.filename)}</span>
                        </div>
                        <div class="badges">
                            <span class="badge badge-egrpou">ЕГРПОУ: ${escapeHtml(chunk.egrpou)}</span>
                            <span class="badge badge-score">Скор: ${chunk.score.toFixed(4)}</span>
                        </div>
                    </div>
                    <div class="card-body" id="${textId}">${highlightedContent}</div>
                    <div class="card-footer">
                        <button class="action-btn" onclick="copyToClipboard('${textId}', this)">
                            <span>📋</span> Скопировать фрагмент
                        </button>
                    </div>
                `;

                resultsContainer.appendChild(card);
            });
        }

        // Копирование текста в буфер обмена
        function copyToClipboard(elementId, btn) {
            // Копируем очищенный оригинальный текст (не HTML)
            const text = document.getElementById(elementId).innerText;
            
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.innerHTML;
                btn.innerHTML = '<span>✅</span> Скопировано!';
                btn.style.borderColor = 'var(--success)';
                btn.style.color = '#ffffff';
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.borderColor = 'var(--border-color)';
                    btn.style.color = 'var(--text-secondary)';
                }, 2000);
            }).catch(err => {
                console.error('Ошибка копирования: ', err);
            });
        }

        // --- Интеграция с Gemini AI (RAG) ---
        function toggleApiKeyVisibility() {
            const isPassword = geminiKeyInput.getAttribute('type') === 'password';
            geminiKeyInput.setAttribute('type', isPassword ? 'text' : 'password');
            const btn = document.getElementById('toggleKeyBtn');
            btn.innerText = isPassword ? '🙈' : '👁️';
        }

        async function askPreset(type) {
            if (!lastSearchResults || lastSearchResults.length === 0) {
                alert('Нет чанков документов для анализа. Сначала выполните поиск.');
                return;
            }

            let prompt = '';
            if (type === 'summarize') {
                prompt = 'Сделай краткую выжимку по содержанию найденных документов. Выдели главное тезисно в виде маркированного списка.';
            } else if (type === 'risks') {
                prompt = 'Проанализируй текст документов на предмет потенциальных юридических или финансовых рисков, ошибок, неточностей или пропущенных важных деталей. Оформи ответ в виде списка рекомендаций.';
            } else if (type === 'finances') {
                prompt = 'Найди и выпиши все официальные реквизиты сторон (компаний, ЕГРПОУ), ключевые даты (даты заключения, сроки действия), а также финансовые суммы и цены, упомянутые в документах.';
            }

            await askGemini(prompt);
        }

        async function askCustomQuestion() {
            const question = aiQuestionInput.value.trim();
            if (!question) {
                alert('Пожалуйста, введите ваш вопрос по документам.');
                return;
            }
            await askGemini(question);
        }

        async function askGemini(promptText) {
            const apiKey = geminiKeyInput.value.trim();
            if (!apiKey) {
                alert('Для анализа документов ИИ, пожалуйста, введите ваш Gemini API Key в поле внизу панели поиска.');
                geminiKeyInput.focus();
                return;
            }

            if (!lastSearchResults || lastSearchResults.length === 0) {
                alert('Нет чанков документов для анализа.');
                return;
            }

            // Показываем лоадер и скрываем старый ответ
            aiLoader.style.display = 'flex';
            aiResponse.style.display = 'none';
            aiResponse.innerHTML = '';

            try {
                // Формируем информацию обо всех загруженных документах клиента
                let filesContext = 'СПИСОК ВСЕХ ЗАГРУЖЕННЫХ ДОКУМЕНТОВ КЛИЕНТА:\n';
                if (currentUniqueFiles && currentUniqueFiles.length > 0) {
                    currentUniqueFiles.forEach((filename, idx) => {
                        filesContext += `${idx + 1}. ${filename}\n`;
                    });
                } else {
                    filesContext += 'Нет информации о загруженных файлах.\n';
                }
                filesContext += '\n';

                // Формируем контекст из чанков документов
                let context = '';
                lastSearchResults.forEach((chunk, index) => {
                    context += `--- ФРАГМЕНТ №${index + 1} (Файл: ${chunk.filename}) ---\n${chunk.text}\n\n`;
                });

                const systemInstruction = 
                    "Ты профессиональный юридический и аналитический ассистент по анализу документов. " +
                    "Твоя задача — точно отвечать на вопросы пользователя на основе предоставленных фрагментов документов (контекста) и списка всех документов клиента. " +
                    "Если пользователь спрашивает об общем количестве документов, о наличии каких-то файлов или просит список файлов, используй список всех загруженных документов клиента. " +
                    "Если во фрагментах нет ответа на содержательный вопрос по тексту, честно скажи об этом, не пытайся выдумывать факты. " +
                    "Обязательно ссылайся на названия файлов (например, [имя_файла.pdf]) при указании конкретных фактов из текста. " +
                    "Форматируй свой ответ с использованием разметки Markdown: жирный шрифт для ключевых понятий, маркированные списки для перечислений, абзацы.";

                const fullPrompt = `${systemInstruction}\n\n${filesContext}КОНТЕКСТ ИЗ ДОКУМЕНТОВ (ФРАГМЕНТЫ):\n${context}\nЗАПРОС ПОЛЬЗОВАТЕЛЯ:\n${promptText}`;

                // Получаем выбранную модель из селектора
                const selectedModel = document.getElementById('geminiModel').value || 'models/gemini-1.5-flash';

                let modelPath = selectedModel;
                if (!modelPath.startsWith('models/')) {
                    modelPath = `models/${modelPath}`;
                }

                const response = await fetch(`https://generativelanguage.googleapis.com/v1/${modelPath}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: fullPrompt
                            }]
                        }]
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    const errMsg = errData.error?.message || `Ошибка сервера (${response.status})`;
                    throw new Error(errMsg);
                }

                const data = await response.json();
                const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text;

                if (!aiText) {
                    throw new Error('Не удалось получить ответ от Gemini (пустой ответ).');
                }

                aiResponse.innerHTML = formatMarkdown(aiText);
                aiResponse.style.display = 'block';

            } catch (error) {
                console.error(error);
                aiResponse.innerHTML = `
                    <div style="color: var(--error); display: flex; flex-direction: column; gap: 0.5rem;">
                        <strong>⚠️ Ошибка работы ИИ Ассистента</strong>
                        <span style="font-size: 0.85rem; line-height: 1.4;">${error.message}</span>
                        <span style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.5rem;">
                            Убедитесь, что ваш API-ключ активен и имеет доступ к выбранной модели. Если эта модель недоступна, выберите другую (например, Gemini 1.5 Pro или Gemini 1.0 Pro) в настройках ИИ Модели выше.
                        </span>
                    </div>
                `;
                aiResponse.style.display = 'block';
            } finally {
                aiLoader.style.display = 'none';
            }
        }

        function formatMarkdown(text) {
            if (!text) return '';
            
            // Безопасно экранируем HTML от инъекций, сохраняя переводы строк
            let html = escapeHtml(text);

            // Обрабатываем жирный текст (**текст**)
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            // Обрабатываем курсив (*текст*)
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');

            // Ссылки на файлы (например [5d1dd584-dc84-4209-9e7f-c880511d142a.pdf]) превращаем в красивые баджики-цитаты
            html = html.replace(/\[([a-zA-Z0-9_\-\.а-яА-ЯёЁ\s]+?\.(?:pdf|docx|txt|png|jpg|jpeg))\]/g, '<span class="source-citation">📄 $1</span>');

            // Делим на абзацы и списки
            const lines = html.split('\n');
            let formattedHtml = '';
            let inList = false;
            let listType = ''; // 'ul' or 'ol'

            lines.forEach(line => {
                const trimmed = line.trim();
                
                if (trimmed === '') {
                    if (inList) {
                        formattedHtml += `</${listType}>`;
                        inList = false;
                        listType = '';
                    }
                    return;
                }

                // Проверка на цитату (> текст)
                if (trimmed.startsWith('&gt; ')) {
                    if (inList) {
                        formattedHtml += `</${listType}>`;
                        inList = false;
                        listType = '';
                    }
                    formattedHtml += `<blockquote>${trimmed.substring(5)}</blockquote>`;
                    return;
                }

                // Проверка на элемент маркированного списка (* или - или •)
                const bulletMatch = trimmed.match(/^[\*\-\u2022]\s+(.*)$/);
                if (bulletMatch) {
                    if (!inList || listType !== 'ul') {
                        if (inList) formattedHtml += `</${listType}>`;
                        formattedHtml += '<ul>';
                        inList = true;
                        listType = 'ul';
                    }
                    formattedHtml += `<li>${bulletMatch[1]}</li>`;
                    return;
                }

                // Проверка на элемент нумерованного списка (1. 2.)
                const numberMatch = trimmed.match(/^(\d+)\.\s+(.*)$/);
                if (numberMatch) {
                    if (!inList || listType !== 'ol') {
                        if (inList) formattedHtml += `</${listType}>`;
                        formattedHtml += '<ol>';
                        inList = true;
                        listType = 'ol';
                    }
                    formattedHtml += `<li>${numberMatch[2]}</li>`;
                    return;
                }

                // Проверка на заголовок h4 (### или ####)
                const headerMatch = trimmed.match(/^(?:#{3,5})\s+(.*)$/);
                if (headerMatch) {
                    if (inList) {
                        formattedHtml += `</${listType}>`;
                        inList = false;
                        listType = '';
                    }
                    formattedHtml += `<h4>${headerMatch[1]}</h4>`;
                    return;
                }

                // Обычный абзац
                if (inList) {
                    formattedHtml += `</${listType}>`;
                    inList = false;
                    listType = '';
                }
                formattedHtml += `<p>${trimmed}</p>`;
            });

            if (inList) {
                formattedHtml += `</${listType}>`;
            }

            return formattedHtml;
        }
    </script>
</body>
</html>
